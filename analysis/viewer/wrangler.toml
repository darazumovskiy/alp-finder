# Хостинг просмотрщика как Cloudflare Worker со статическими ассетами (лимит 100 000 файлов на Workers Paid
# против 20 000 у Pages). Воркер _worker.js (в .gitignore, содержит пароль Basic Auth) обрабатывает каждый
# запрос первым (run_worker_first) и отдаёт файлы из dist через env.ASSETS — тот же интерфейс, что был в Pages.
# Деплой: scripts/deploy_private.sh → npx wrangler deploy -c analysis/viewer/wrangler.toml
name = "alp-finder-team"
main = "_worker.js"
compatibility_date = "2026-08-01"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
html_handling = "auto-trailing-slash"
not_found_handling = "none"
